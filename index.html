<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172f40">
  <meta name="description" content="The family holiday passport for Arthur's Travelling Circus. Save the stops, score the snacks and keep the holiday memories.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/circus-logo.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Arthur's Travelling Circus</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img src="./assets/circus-logo.png" alt="Arthur's Travelling Circus"><div><strong>Arthur's Travelling Circus</strong><small>Eat. Drink. Rate. Repeat.</small></div></div>
      <label class="profile-switch">Playing as <select id="profile-select" aria-label="Choose family profile"></select></label>
    </header>
    <main id="app" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-tab="home" class="active"><span>🧳</span>Passport</button>
      <button data-tab="places"><span>🍽️</span>Stops</button>
      <button data-tab="diary"><span>📖</span>Diary</button>
      <button data-tab="awards"><span>🏆</span>Awards</button>
      <button data-tab="family"><span>🎪</span>Family</button>
    </nav>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
