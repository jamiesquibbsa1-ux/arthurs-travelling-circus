<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12364a">
  <meta name="description" content="A family holiday passport for the places, meals and memories worth talking about — and the ones that need a formal complaint.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/jpeg" href="./circus-logo.jpg">
  <link rel="apple-touch-icon" href="./circus-logo.jpg">
  <link rel="stylesheet" href="./styles.css">
  <title>Arthur's Holiday Passport</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="./circus-logo.jpg" alt="Arthur’s holiday coach logo"><div><strong>Arthur's Holiday Passport</strong><small>EAT. DRINK. RATE. REPEAT.</small></div></div>
      <label class="profile-switch"><span>Writing as</span><select id="profile-select" aria-label="Choose family member"></select></label>
    </header>
    <main id="app" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-tab="home" class="active"><span>▣</span>Passport</button>
      <button data-tab="places"><span>⌖</span>Places</button>
      <button data-tab="diary"><span>▤</span>Diary</button>
      <button data-tab="awards"><span>★</span>Verdicts</button>
      <button data-tab="family"><span>♙</span>Family</button>
    </nav>
  </div>
  <script src="./backend-config.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
